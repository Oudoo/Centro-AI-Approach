# Centro CDX — GEO/AEO Scorecard (v3.0 weighting)
# Score each category 0-100 with brief evidence, then run:
#   python scripts/geo_score.py assets/geo_scorecard.yml
# Re-score monthly. The trend is the point, not any single number.
# Weights are fixed in geo_score.py and sum to 100.

categories:
  # Phase 1 — can AI/search bots fetch AND render the site?
  # (run check_ai_crawlers.py; also confirm content renders without JS)
  crawlability:
    score: 0
    evidence: ""        # e.g. "robots.txt allows all critical bots; SSR verified"

  # Core technical SEO: status codes, canonicals, sitemap, Core Web Vitals
  technical_seo:
    score: 0
    evidence: ""

  # % of key pages with valid JSON-LD (run validate_schema.py per template)
  schema_coverage:
    score: 0
    evidence: ""

  # Are entities (@id) linked into one consistent graph? Org<->Service<->etc.
  knowledge_graph_completeness:
    score: 0
    evidence: ""

  # Atomic-passage pass rate from passage_lint.py across published pages (40-80w)
  content_citability:
    score: 0
    evidence: ""

  # How often Centro is cited in the AI query bank (Cowork tracker output)
  ai_citation_frequency:
    score: 0
    evidence: ""        # e.g. "cited in 12/250 prompts, avg position 2"

  # NEW in v3.0: visibility on COMMERCIAL queries that drive leads
  # (e.g. "best BPO company Egypt", "payroll outsourcing GCC cost")
  commercial_visibility:
    score: 0
    evidence: ""        # e.g. "cited on 6/40 buyer-intent prompts"

  # Centro's mention share vs named competitors on target topics
  entity_share_of_voice:
    score: 0
    evidence: ""

  # Off-site references: directories, partner pages, press, listings
  external_authority_signals:
    score: 0
    evidence: ""
